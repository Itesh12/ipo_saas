name: SEBI Regulatory Filings Sync

on:
  schedule:
    # Mon-Fri: 02:00, 06:00, 10:00, 14:00 UTC (07:30, 11:30, 15:30, 19:30 IST)
    - cron: '0 2,6,10,14 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    name: Execute SEBI Regulatory Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger SEBI Sync on Vercel Production
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-cron/1.0" \
            -H "x-initiated-by: github_actions_cron" \
            "https://ipo-saas.vercel.app/api/admin/ipo-sync/run?source=sebi")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response Payload:"
          echo "$HTTP_BODY"

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 207 ]; then
            echo "::error::SEBI Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

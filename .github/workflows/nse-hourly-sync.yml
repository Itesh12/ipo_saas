name: NSE Hourly Sync

on:
  schedule:
    # Mon-Fri: 03:00 to 12:00 UTC (08:30 to 17:30 IST trading hours)
    - cron: '0 3-12 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    name: Execute NSE Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger NSE Sync on Vercel Production
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-cron/1.0" \
            -H "x-initiated-by: github_actions_cron" \
            "https://ipo-saas.vercel.app/api/admin/ipo-sync/run?source=nse")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response Payload:"
          echo "$HTTP_BODY"

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 207 ]; then
            echo "::error::NSE Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

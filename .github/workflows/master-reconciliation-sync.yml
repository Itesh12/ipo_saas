name: Master Universe Reconciliation Sync

on:
  schedule:
    # Daily: 02:30 & 12:00 UTC (08:00 & 17:30 IST)
    - cron: '30 2,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Execute Master Reconciliation & Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Master Sync on Vercel Production
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-cron/1.0" \
            -H "x-initiated-by: github_actions_cron" \
            "https://ipo-saas.vercel.app/api/admin/ipo-sync/run?source=all")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response Payload:"
          echo "$HTTP_BODY"

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 207 ]; then
            echo "::error::Master Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
